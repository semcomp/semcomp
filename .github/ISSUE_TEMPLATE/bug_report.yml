name: "Bug Report"
description: Reporte um bug ou comportamento inesperado
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar um bug! Preencha as informações abaixo para nos ajudar a reproduzir e corrigir o problema.

  - type: dropdown
    id: area
    attributes:
      label: Área afetada
      options:
        - Site (front-site)
        - Backoffice (front-backoffice)
        - Backend (API)
        - Infraestrutura / Deploy
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Descrição do bug
      description: O que aconteceu? O que era esperado?
      placeholder: |
        **O que aconteceu:** ...
        **O que era esperado:** ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Acesse '...'
        2. Clique em '...'
        3. Veja o erro
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Ambiente
      placeholder: |
        - Navegador: Chrome 120 / Firefox 121
        - SO: Windows 11 / macOS 14
        - URL (se prod/staging): ...
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / vídeos
      description: Se aplicável, adicione prints ou gravações para ilustrar o problema.
    validations:
      required: false
