server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # ── Compressão gzip ─────────────────────────────────────────────
    # (brotli exigiria imagem nginx com ngx_brotli — a nginx:alpine oficial não tem)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_disable "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf;

    # SPA — assets com hash no nome mudam a cada build
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html nunca pode ficar em cache longo (fallback do SPA)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* ^/api/uploads/(papfe|absence-justifications)/ {
        return 403;
    }

    location /api/ {
        proxy_pass http://backend:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}