            additionalProperties:
              type: string
            type: object
        "409":
          description: Justificativa já enviada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Envia a justificativa de ausência do usuário autenticado
      tags:
      - Justificativas de Ausência
  /api/absence-justifications/{id}:
    patch:
      consumes:
      - multipart/form-data
      description: Edita o motivo e, opcionalmente, substitui o anexo da justificativa
        do usuário autenticado. Permitido apenas quando o status for "em_analise"
        ou "documento_invalido"; editar reenvia a justificativa para análise.
      parameters:
      - description: ID da justificativa
        in: path
        name: id
        required: true
        type: integer
      - description: Motivo da ausência
        in: formData
        name: reason
        required: true
        type: string
      - description: Novo comprovante (opcional, substitui o anterior)
        in: formData
        name: attachment
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Justificativa atualizada com sucesso!
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Dados inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Justificativa não pertence ao usuário
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Justificativa não encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Justificativa já aprovada ou negada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Atualiza a justificativa de ausência do usuário autenticado
      tags:
      - Justificativas de Ausência
  /api/absence-justifications/{id}/attachment:
    get:
      description: Retorna o arquivo comprobatório da justificativa do usuário autenticado
      parameters:
      - description: ID da justificativa
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Arquivo anexo
          schema:
            type: file
        "400":
          description: ID inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Justificativa não pertence ao usuário
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Justificativa não encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Obtém o anexo da própria justificativa de ausência
      tags:
      - Justificativas de Ausência
  /api/absence-justifications/mine:
    get:
      description: Retorna a justificativa de ausência enviada pelo usuário autenticado,
        se houver
      produces:
      - application/json
      responses:
        "200":
          description: Justificativa do usuário
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Nenhuma justificativa enviada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Obtém a justificativa de ausência do usuário autenticado
      tags:
      - Justificativas de Ausência
  /api/papfe-document:
    get:
      description: Retorna os metadados do comprovante PAPFE do usuário autenticado
        (sem os bytes do arquivo), incluindo o motivo da rejeição quando houver
      produces:
      - application/json
      responses:
        "200":
          description: Comprovante PAPFE do usuário
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Nenhum comprovante enviado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Obtém o próprio comprovante PAPFE
      tags:
      - Usuários (Participantes)
    put:
      consumes:
      - multipart/form-data
      description: Atualiza o comprovante PAPFE do usuário autenticado. Aceita multipart/form-data.
      parameters:
      - description: Comprovante PAPFE (PDF/JPEG/PNG/WebP, máx 10MB)
        in: formData
        name: papfe_document
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Comprovante PAPFE atualizado com sucesso!
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Dados inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Atualiza comprovante PAPFE
      tags:
      - Usuários (Participantes)
  /api/profile:
    get:
      description: Retorna os dados do usuário autenticado via token JWT
      produces:
      - application/json
      responses:
        "200":
          description: Entrada Permitida
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Perfil do usuário
      tags:
      - Auth Público
  /event/{eventName}/{initDate}:
    get:
      consumes:
      - application/json
      description: Retorna os dados de um evento específico
      parameters:
      - description: Nome do evento
        in: path
        name: eventName
        required: true
        type: string
      - description: Data de início do evento (RFC3339)
        in: path
        name: initDate
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Evento encontrado
          schema:
            $ref: '#/definitions/event.Event'
        "400":
          description: Data inválida
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Evento não encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Evento já existe
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Busca evento por nome e data
      tags:
      - Event Público
  /events:
    get:
      consumes:
      - application/json
      description: Retorna uma lista paginada de eventos cadastrados
      parameters:
      - default: 1
        description: Página atual
        in: query
        name: page
        type: integer
      - default: 10
        description: Limite de itens por página
        in: query
        name: limit
        type: integer
      - default: init_date
        description: Campo de ordenação
        in: query
        name: sort_by
        type: string
      - default: asc
        description: Ordem (asc/desc)
        in: query
        name: sort_order
        type: string
      - description: Campo de busca
        in: query
        name: search_by
        type: string
      - description: Valor de busca
        in: query
        name: search_value
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Lista de eventos paginada
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Parâmetro inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Lista eventos
      tags:
      - Event Público
  /login:
    post:
      consumes:
      - application/json
      description: Autentica um usuário participante e retorna o token JWT do site
        público
      parameters:
      - description: Credenciais de login
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            additionalProperties: true
            type: object
        "400":
          description: JSON ou requisição inválida
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Email e/ou senha inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login de participante
      tags:
      - Auth Público
  /register:
    post:
      consumes:
      - multipart/form-data
      description: Cadastra um participante no sistema. Aceita multipart/form-data
        para suportar upload do comprovante PAPFE.
      parameters:
      - description: Nome completo
        in: formData
        name: name
        required: true
        type: string
      - description: E-mail
        in: formData
        name: email
        required: true
        type: string
      - description: Senha (min 8 caracteres)
        in: formData
        name: password
        required: true
        type: string
      - description: Idade
        in: formData
        name: age
        required: true
        type: integer
      - description: Gênero
        in: formData
        name: gender
        required: true
        type: string
      - description: Cidade
        in: formData
        name: city
        required: true
        type: string
      - description: Formação
        in: formData
        name: education
        required: true
        type: string
      - description: Recebe PAPFE?
        in: formData
        name: hasPapfe
        type: boolean
      - collectionFormat: csv
        description: Lista de deficiências
        in: formData
        items:
          type: string
        name: disabilities
        type: array
      - description: Profissão
        in: formData
        name: profession
        type: string
      - description: LinkedIn
        in: formData
        name: linkedin
        type: string
      - description: Telegram
        in: formData
        name: telegram
        type: string
      - description: Comprovante PAPFE (PDF/JPEG/PNG/WebP, máx 10MB)
        in: formData
        name: papfe_document
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Usuário criado com sucesso!
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Dados inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: E-mail já cadastrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cria um novo usuário
      tags:
      - Usuários (Participantes)
  /resend-verification:
    post:
      consumes:
      - application/json
      description: Reenvia o link de confirmação de e-mail, se aplicável
      parameters:
      - description: E-mail do usuário
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.ResendVerificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Se o e-mail estiver cadastrado e pendente de confirmação, um
            novo link foi enviado
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Dados inválidos
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Reenvia e-mail de confirmação
      tags:
      - Usuários (Participantes)
  /sponsors:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/sponsor.PublicSponsor'
            type: array
      summary: Lista patrocinadores públicos
      tags:
      - Sponsors
  /sponsors/{cnpj}/click:
    post:
      parameters:
      - description: CNPJ do patrocinador (14 dígitos)
        in: path
        name: cnpj
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Registra clique em patrocinador
      tags:
      - Sponsors
  /stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              format: int64
              type: integer
            type: object
      summary: Retorna estatísticas do site
      tags:
      - Stats
  /verify-email:
    post:
      consumes:
      - application/json
      description: Valida o token de verificação enviado por e-mail e ativa a conta
      parameters:
      - description: Token de verificação
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: E-mail confirmado com sucesso!
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Dados inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Token inválido ou expirado
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Confirma e-mail de um usuário
      tags:
      - Usuários (Participantes)
  /visit:
    post:
      responses:
        "204":
          description: No Content
      summary: Registra visita à home page
      tags:
      - Stats
securityDefinitions:
  BearerAuth:
    description: 'Insira o token no formato: Bearer {seu_token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
