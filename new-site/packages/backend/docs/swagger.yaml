basePath: /
definitions:
  absenceJustification.UpdateStatusRequest:
    properties:
      rejection_reason:
        description: Obrigatório quando Status="negado"; ignorado/limpo nos demais
          status.
        type: string
      status:
        enum:
        - em_analise
        - aprovado
        - negado
        - documento_invalido
        type: string
    required:
    - status
    type: object
  auth.LoginUserRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  authBackoffice.LoginUserBackofficeRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  event.CreateEventRequest:
    properties:
      description:
        type: string
      end_date:
        type: string
      has_attendance:
        type: boolean
      init_date:
        type: string
      location:
        type: string
      name:
        maxLength: 200
        type: string
      type:
        maxLength: 50
        type: string
    required:
    - end_date
    - init_date
    - name
    type: object
  event.Event:
    properties:
      description:
        type: string
      end_date:
        type: string
      has_attendance:
        type: boolean
      init_date:
        type: string
      location:
        type: string
      name:
        type: string
      type:
        type: string
    type: object
  event.UpdateEventRequest:
    properties:
      description:
        type: string
      end_date:
        type: string
      has_attendance:
        type: boolean
      init_date:
        type: string
      location:
        type: string
      name:
        maxLength: 200
        type: string
      type:
        maxLength: 50
        type: string
    required:
    - end_date
    - init_date
    - name
    type: object
  permission.Permission:
    properties:
      permission_type:
        description: nil = sem acesso, "R" ou "RW"
        type: string
      section_name:
        type: string
      user:
        $ref: '#/definitions/userBackoffice.UserBackoffice'
      user_email:
        type: string
    type: object
  permission.PermissionRequest:
    properties:
      permission_type:
        maxLength: 2
        type: string
      section_name:
        maxLength: 200
        type: string
      user_email:
        maxLength: 150
        type: string
    required:
    - section_name
    - user_email
    type: object
  presence.CreatePresenceRequest:
    properties:
      email_admin:
        maxLength: 255
        type: string
      event_init_date:
        type: string
      event_name:
        maxLength: 200
        type: string
      user_number:
        type: integer
    required:
    - email_admin
    - event_init_date
    - event_name
    - user_number
    type: object
  presence.Presence:
    properties:
      email_admin:
        type: string
      event_init_date:
        type: string
      event_name:
        type: string
      user_number:
        type: integer
    type: object
  presence.UpdatePresenceRequest:
    properties:
      email_admin:
        maxLength: 255
        type: string
      event_init_date:
        type: string
      event_name:
        maxLength: 200
        type: string
      user_number:
        type: integer
    required:
    - email_admin
    - event_init_date
    - event_name
    - user_number
    type: object
  product.Coffee:
    properties:
      date_time:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  product.ComboItem:
    properties:
      combo_id:
        type: integer
      item_id:
        type: integer
    type: object
  product.CreateCoffeeRequest:
    properties:
      date_time:
        type: string
      name:
        maxLength: 200
        type: string
    required:
    - date_time
    - name
    type: object
  product.CreateKitRequest:
    properties:
      color:
        maxLength: 50
        type: string
      is_babydoll:
        type: boolean
      name:
        maxLength: 200
        type: string
      size:
        maxLength: 50
        type: string
    required:
    - color
    - name
    - size
    type: object
  product.CreateProductRequest:
    properties:
      coffee:
        $ref: '#/definitions/product.CreateCoffeeRequest'
      is_selling:
        type: boolean
      items:
        items:
          type: integer
        type: array
      kit:
        $ref: '#/definitions/product.CreateKitRequest'
      price:
        type: number
      type:
        allOf:
        - $ref: '#/definitions/product.ProductType'
        enum:
        - KIT
        - COFFEE
        - COMBO
    required:
    - price
    - type
    type: object
  product.Kit:
    properties:
      color:
        type: string
      id:
        type: integer
      is_babydoll:
        type: boolean
      name:
        type: string
      size:
        type: string
    type: object
  product.Product:
    properties:
      coffee:
        $ref: '#/definitions/product.Coffee'
      combo_items:
        items:
          $ref: '#/definitions/product.ComboItem'
        type: array
      id:
        type: integer
      is_selling:
        type: boolean
      kit:
        allOf:
        - $ref: '#/definitions/product.Kit'
        description: |-
          Relacionamentos (preload)
          li que é uma boa prática usar isso aqui
      picture_url:
        type: string
      price:
        type: number
      type:
        $ref: '#/definitions/product.ProductType'
    type: object
  product.ProductType:
    enum:
    - KIT
    - COFFEE
    - COMBO
    type: string
    x-enum-varnames:
    - ProductTypeKit
    - ProductTypeCoffee
    - ProductTypeCombo
  product.UpdateCoffeeRequest:
    properties:
      date_time:
        type: string
      name:
        maxLength: 200
        type: string
    required:
    - date_time
    - name
    type: object
  product.UpdateKitRequest:
    properties:
      color:
        maxLength: 50
        type: string
      is_babydoll:
        type: boolean
      name:
        maxLength: 200
        type: string
      size:
        maxLength: 50
        type: string
    required:
    - color
    - name
    - size
    type: object
  product.UpdateProductRequest:
    properties:
      coffee:
        $ref: '#/definitions/product.UpdateCoffeeRequest'
      is_selling:
        type: boolean
      items:
        items:
          type: integer
        type: array
      kit:
        $ref: '#/definitions/product.UpdateKitRequest'
      price:
        type: number
      type:
        allOf:
        - $ref: '#/definitions/product.ProductType'
        enum:
        - KIT
        - COFFEE
        - COMBO
    required:
    - price
    - type
    type: object
  sponsor.PublicSponsor:
    properties:
      cnpj:
        type: string
      logo:
        type: string
      name:
        type: string
      website:
        type: string
    type: object
  sponsor.Sponsor:
    properties:
      clicks:
        type: integer
      cnpj:
        type: string
      logo:
        type: string
      name:
        type: string
      packages:
        items:
          $ref: '#/definitions/sponsor.SponsorPackage'
        type: array
      website:
        type: string
    type: object
  sponsor.SponsorPackage:
    properties:
      package:
        type: string
      sponsor_cnpj:
        type: string
      year:
        type: integer
    type: object
  user.PapfeApprovalRequest:
    properties:
      approved:
        type: boolean
      rejection_reason:
        description: Obrigatório quando Approved=false (rejeição).
        type: string
    required:
    - approved
    type: object
  user.ResendVerificationRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  user.SafeUser:
    properties:
      age:
        type: integer
      city:
        type: string
      disabilities:
        type: string
      education:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      gender:
        type: string
      hasPapfe:
        type: boolean
      linkedin:
        type: string
      name:
        type: string
      presence_rate:
        type: number
      profession:
        type: string
      telegram:
        type: string
      user_number:
        type: string
    type: object
  user.UpdateUserRequest:
    properties:
      age:
        type: integer
      city:
        type: string
      disabilities:
        type: string
      education:
        type: string
      email:
        type: string
      gender:
        type: string
      hasPapfe:
        type: boolean
      linkedin:
        type: string
      name:
        type: string
      profession:
        type: string
      telegram:
        type: string
    required:
    - age
    - city
    - disabilities
    - education
    - email
    - gender
    - name
    type: object
  user.VerifyEmailRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  userBackoffice.CreateUserBackofficeRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  userBackoffice.SafeUserB:
    properties:
      email:
        type: string
    type: object
  userBackoffice.UpdateUserBackofficeRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  userBackoffice.UserBackoffice:
    properties:
      email:
        type: string
      passwordHash:
        type: string
    type: object
host: localhost:4000
info:
  contact: {}
  description: API do backend da Semcomp.
  title: Semcomp API
  version: "1.0"
paths:
  /admin/absence-justifications:
    get:
      description: Retorna todas as justificativas de ausência cadastradas
      produces:
      - application/json
      responses:
        "200":
          description: Lista de justificativas de ausência
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lista justificativas de ausência
      tags:
      - Justificativas de Ausência
  /admin/absence-justifications/{id}:
    patch:
      consumes:
      - application/json
      description: Aprova, rejeita, marca como documento inválido ou volta para análise
        uma justificativa de ausência. Ao negar, o campo rejection_reason é obrigatório
        e só persiste nesse status.
      parameters:
      - description: ID da justificativa
        in: path
        name: id
        required: true
        type: integer
      - description: Novo status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/absenceJustification.UpdateStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Status atualizado com sucesso!
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Dados inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Justificativa não encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Atualiza o status de uma justificativa de ausência
      tags:
      - Justificativas de Ausência
  /admin/absence-justifications/{id}/attachment:
    get:
      description: Retorna o arquivo comprobatório de uma justificativa de ausência
        específica
      parameters:
      - description: ID da justificativa
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Arquivo anexo
          schema:
            type: file
        "400":
          description: ID inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Justificativa não encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Obtém o anexo de uma justificativa de ausência
      tags:
      - Justificativas de Ausência
  /admin/events:
    post:
      consumes:
      - application/json
      description: Cadastra um evento no sistema
      parameters:
      - description: Dados do evento
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/event.CreateEventRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Evento criado com sucesso!
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Dados inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Evento já existe
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cria um novo evento
      tags:
      - Event Backoffice
  /admin/events/{eventName}/{initDate}:
    delete:
      consumes:
      - application/json
      description: Remove um evento do sistema
      parameters:
      - description: Nome do evento
        in: path
        name: eventName
        required: true
        type: string
      - description: Data de início do evento (RFC3339)
        in: path
        name: initDate
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Evento removido com sucesso
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Data inválida
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Evento não encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Deleta evento
      tags:
      - Event Backoffice
    put:
      consumes:
      - application/json
      description: Altera os dados de um evento existente
      parameters:
      - description: Nome do evento
        in: path
        name: eventName
        required: true
        type: string
      - description: Data de início do evento (RFC3339)
        in: path
        name: initDate
        required: true
        type: string
      - description: Dados para atualização
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/event.UpdateEventRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Evento atualizado com sucesso
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Dados inválidos ou data inválida
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Evento não encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Atualiza evento
      tags:
      - Event Backoffice
  /admin/login:
    post:
      consumes:
      - application/json
      description: Autentica um usuário administrador e retorna o token JWT com permissões
      parameters:
      - description: Credenciais de login
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/authBackoffice.LoginUserBackofficeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login realizado
          schema:
            additionalProperties: true
            type: object
        "400":
          description: JSON ou requisição inválida
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Email e/ou senha inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login do backoffice
      tags:
      - Auth Backoffice
  /admin/papfe-documents:
    get:
      description: Retorna metadados de todos os comprovantes PAPFE cadastrados
      produces:
      - application/json
      responses:
        "200":
          description: Lista de comprovantes PAPFE
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lista comprovantes PAPFE
      tags:
      - Usuários (Participantes)
  /admin/permissions:
    get:
      consumes:
      - application/json
      description: Retorna uma lista paginada de permissões cadastradas
      parameters:
      - default: 1
        description: Página atual
        in: query
        name: page
        type: integer
      - default: 10
        description: Limite de itens por página
        in: query
        name: limit
        type: integer
      - default: user_email
        description: Campo de ordenação
        in: query
        name: sort_by
        type: string
      - default: asc
        description: Ordem (asc/desc)
        in: query
        name: sort_order
        type: string
      - description: Campo de busca
        in: query
        name: search_by
        type: string
      - description: Valor de busca
        in: query
        name: search_value
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Lista de permissões paginada
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Parâmetro inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lista permissões
      tags:
      - Permission Backoffice
    post:
      consumes:
      - application/json
      description: Vincula uma permissão (R ou RW) de um usuário do backoffice a uma
        seção
      parameters:
      - description: Dados da permissão
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/permission.PermissionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Permissão criada com sucesso!
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Dados inválidos, seção/usuário inexistente ou tipo inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cria uma nova permissão
      tags:
      - Permission Backoffice
  /admin/permissions/{user}/{section}:
    delete:
      consumes:
      - application/json
      description: Remove uma permissão do sistema
      parameters:
      - description: Email do usuário do backoffice
        in: path
        name: user
        required: true
        type: string
      - description: Nome da seção
        in: path
        name: section
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Permissão removida com sucesso
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Permissão não encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Deleta permissão
      tags:
      - Permission Backoffice
    put:
      consumes:
      - application/json
      description: Altera os dados de uma permissão existente identificada por usuário
        e seção
      parameters:
      - description: Email do usuário do backoffice
        in: path
        name: user
        required: true
        type: string
      - description: Nome da seção
        in: path
        name: section
        required: true
        type: string
      - description: Dados para atualização
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/permission.PermissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Permissão atualizada com sucesso
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Dados inválidos, seção/usuário inexistente ou tipo inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Permissão não encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Atualiza permissão
      tags:
      - Permission Backoffice
  /admin/permissions/me:
    get:
      description: Retorna as permissões do próprio admin autenticado
      produces:
      - application/json
      responses:
        "200":
          description: Permissões encontradas
          schema:
            items:
              $ref: '#/definitions/permission.Permission'
            type: array
        "404":
          description: Permissão não encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Busca minhas permissões
      tags:
      - Permission Backoffice
  /admin/permissions/section/{section}:
    get:
      consumes:
      - application/json
      description: Retorna as permissões vinculadas a uma seção
      parameters:
      - description: Nome da seção
        in: path
        name: section
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Permissões encontradas
          schema:
            items:
              $ref: '#/definitions/permission.Permission'
            type: array
        "400":
          description: Seção inexistente
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Permissão não encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Busca permissões por seção
      tags:
      - Permission Backoffice
  /admin/presences:
    get:
      consumes:
      - application/json
      description: Retorna uma lista paginada de presenças registradas
      parameters:
      - default: 1
        description: Página atual
        in: query
        name: page
        type: integer
      - default: 10
        description: Limite de itens por página
        in: query
        name: limit
        type: integer
      - default: event_init_date
        description: Campo de ordenação
        in: query
        name: sort_by
        type: string
      - default: asc
        description: Ordem (asc/desc)
        in: query
        name: sort_order
        type: string
      - description: Campo de busca
        in: query
        name: search_by
        type: string
      - description: Valor de busca
        in: query
        name: search_value
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Lista de presenças paginada
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Parâmetro inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
