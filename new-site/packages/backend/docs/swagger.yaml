          description: E-mail confirmado com sucesso!
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Dados inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Token inválido ou expirado
          schema:
            additionalProperties:
              type: string
            type: object
