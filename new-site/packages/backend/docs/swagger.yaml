basePath: /
definitions:
  auth.LoginUserRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  presence.CreatePresenceRequest:
    properties:
      email_admin:
        maxLength: 255
        type: string
      event_init_date:
        type: string
      event_name:
        maxLength: 200
        type: string
      user_number:
        type: integer
    required:
    - email_admin
    - event_init_date
    - event_name
    - user_number
    type: object
  presence.Presence:
    properties:
      email_admin:
        type: string
      event_init_date:
        type: string
      event_name:
        type: string
      user_number:
        type: integer
    type: object
  presence.UpdatePresenceRequest:
    properties:
      email_admin:
        maxLength: 255
        type: string
      event_init_date:
        type: string
      event_name:
        maxLength: 200
        type: string
      user_number:
        type: integer
    required:
    - email_admin
    - event_init_date
    - event_name
    - user_number
    type: object
  section.CreateSectionRequest:
    properties:
      description:
        type: string
      name:
        maxLength: 200
        type: string
    required:
    - name
    type: object
  section.Section:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  section.UpdateSectionRequest:
    properties:
      description:
        type: string
      name:
        maxLength: 200
        type: string
    required:
    - name
    type: object
  user.CreateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  user.SafeUser:
    properties:
      email:
        type: string
      name:
        type: string
      presence_rate:
        type: number
      user_number:
        type: string
    type: object
  user.UpdateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 8
        type: string
      presence_rate:
        minimum: 0
        type: number
    required:
    - email
    - name
    type: object
host: localhost:4000
info:
  contact: {}
  description: API do backend da Semcomp.
  title: Semcomp API
  version: "1.0"
paths:
  /admin/presences:
    get:
      consumes:
      - application/json
      description: Retorna uma lista paginada de presenças registradas
      parameters:
      - default: 1
        description: Página atual
        in: query
        name: page
        type: integer
      - default: 10
        description: Limite de itens por página
        in: query
        name: limit
        type: integer
      - default: event_init_date
        description: Campo de ordenação
        in: query
        name: sort_by
        type: string
      - default: asc
        description: Ordem (asc/desc)
        in: query
        name: sort_order
        type: string
      - description: Campo de busca
        in: query
        name: search_by
        type: string
      - description: Valor de busca
        in: query
        name: search_value
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Lista de presenças paginada
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Parâmetro inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lista presenças
      tags:
      - Presence Backoffice
    post:
      consumes:
      - application/json
      description: Registra a presença de um usuário em um evento
      parameters:
      - description: Dados da presença
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/presence.CreatePresenceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Presença criada com sucesso!
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Dados inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cria uma nova presença
      tags:
      - Presence Backoffice
  /admin/presences/{userNumber}/{eventName}/{eventInitDate}:
    delete:
      consumes:
      - application/json
      description: Remove uma presença do sistema identificada pela chave composta
      parameters:
      - description: Número do usuário
        in: path
        name: userNumber
        required: true
        type: string
      - description: Nome do evento
        in: path
        name: eventName
        required: true
        type: string
      - description: Data de início do evento (RFC3339)
        in: path
        name: eventInitDate
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Presença removida com sucesso
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Data inválida
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Presença não encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Deleta presença
      tags:
      - Presence Backoffice
    get:
      consumes:
      - application/json
      description: Retorna uma presença específica pelo número do usuário, nome do
        evento e data de início
      parameters:
      - description: Número do usuário
        in: path
        name: userNumber
        required: true
        type: string
      - description: Nome do evento
        in: path
        name: eventName
        required: true
        type: string
      - description: Data de início do evento (RFC3339)
        in: path
        name: eventInitDate
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Presença encontrada
          schema:
            $ref: '#/definitions/presence.Presence'
        "400":
          description: Data inválida
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Presença não encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Busca presença por chave composta
      tags:
      - Presence Backoffice
    put:
      consumes:
      - application/json
      description: Altera os dados de uma presença existente identificada pela chave
        composta
      parameters:
      - description: Número do usuário
        in: path
        name: userNumber
        required: true
        type: string
      - description: Nome do evento
        in: path
        name: eventName
        required: true
        type: string
      - description: Data de início do evento (RFC3339)
        in: path
        name: eventInitDate
        required: true
        type: string
      - description: Dados para atualização
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/presence.UpdatePresenceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Presença atualizada com sucesso
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Dados inválidos ou data inválida
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Presença não encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Atualiza presença
      tags:
      - Presence Backoffice
  /admin/sections:
    get:
      consumes:
      - application/json
      description: Retorna uma lista paginada de seções cadastradas
      parameters:
      - default: 1
        description: Página atual
        in: query
        name: page
        type: integer
      - default: 10
        description: Limite de itens por página
        in: query
        name: limit
        type: integer
      - default: name
        description: Campo de ordenação
        in: query
        name: sort_by
        type: string
      - default: asc
        description: Ordem (asc/desc)
        in: query
        name: sort_order
        type: string
      - description: Campo de busca
        in: query
        name: search_by
        type: string
      - description: Valor de busca
        in: query
        name: search_value
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Lista de seções paginada
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Parâmetro inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lista seções
      tags:
      - Section Backoffice
    post:
      consumes:
      - application/json
      description: Cadastra uma seção no sistema
      parameters:
      - description: Dados da seção
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/section.CreateSectionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Seção criada com sucesso!
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Dados inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cria uma nova seção
      tags:
      - Section Backoffice
  /admin/sections/{sectionName}:
    delete:
      consumes:
      - application/json
      description: Remove uma seção do sistema
      parameters:
      - description: Nome da seção
        in: path
        name: sectionName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Seção removida com sucesso
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Seção não encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Deleta seção
      tags:
      - Section Backoffice
    get:
      consumes:
      - application/json
      description: Retorna os dados de uma seção específica
      parameters:
      - description: Nome da seção
        in: path
        name: sectionName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Seção encontrada
          schema:
            $ref: '#/definitions/section.Section'
        "404":
          description: Seção não encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Busca seção por nome
      tags:
      - Section Backoffice
    put:
      consumes:
      - application/json
      description: Altera os dados de uma seção existente
      parameters:
      - description: Nome da seção
        in: path
        name: sectionName
        required: true
        type: string
      - description: Dados para atualização
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/section.UpdateSectionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Seção atualizada com sucesso
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Dados inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Seção não encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Atualiza seção
      tags:
      - Section Backoffice
  /admin/users:
    get:
      consumes:
      - application/json
      description: Retorna uma lista paginada de usuários cadastrados
      parameters:
      - default: 1
        description: Página atual
        in: query
        name: page
        type: integer
      - default: 10
        description: Limite de itens por página
        in: query
        name: limit
        type: integer
      - default: name
        description: Campo de ordenação
        in: query
        name: sort_by
        type: string
      - default: asc
        description: Ordem (asc/desc)
        in: query
        name: sort_order
        type: string
      - description: Campo de busca
        in: query
        name: search_by
        type: string
      - description: Valor de busca
        in: query
        name: search_value
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Lista de usuários paginada
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Parâmetro inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lista usuários
      tags:
      - User Backoffice
  /admin/users/{id}:
    delete:
      consumes:
      - application/json
      description: Remove um usuário do sistema
      parameters:
      - description: ID do usuário
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Usuário removido com sucesso
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: ID inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Usuário não existe
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Deleta usuário
      tags:
      - User Backoffice
    get:
      consumes:
      - application/json
      description: Retorna os dados de um usuário específico
      parameters:
      - description: ID do usuário
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Usuário encontrado
          schema:
            $ref: '#/definitions/user.SafeUser'
        "400":
          description: ID inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Usuário não encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Busca usuário por ID
      tags:
      - User Backoffice
    put:
      consumes:
      - application/json
      description: Altera os dados de um usuário existente
      parameters:
      - description: ID do usuário
        in: path
        name: id
        required: true
        type: integer
      - description: Dados para atualização
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Usuário atualizado com sucesso
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Dados ou ID inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Email já cadastrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Atualiza usuário
      tags:
      - User Backoffice
  /login:
    post:
      consumes:
      - application/json
      description: Autentica um usuário participante e retorna o token JWT do site
        público
      parameters:
      - description: Credenciais de login
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            additionalProperties: true
            type: object
        "400":
          description: JSON ou requisição inválida
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Email e/ou senha inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login de participante
      tags:
      - Auth Público
  /register:
    post:
      consumes:
      - application/json
      description: Cadastra um participante no sistema
      parameters:
      - description: Dados de cadastro
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Usuário criado com sucesso!
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Dados inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: E-mail já cadastrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cria um novo usuário
      tags:
      - User
securityDefinitions:
  BearerAuth:
    description: 'Insira o token no formato: Bearer {seu_token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
