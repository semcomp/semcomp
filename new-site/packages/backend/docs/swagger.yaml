        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Registra clique em patrocinador
      tags:
      - Sponsors
  /stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              format: int64
              type: integer
            type: object
      summary: Retorna estatísticas do site
      tags:
      - Stats
  /verify-email:
    post:
      consumes:
      - application/json
      description: Valida o token de verificação enviado por e-mail e ativa a conta
      parameters:
