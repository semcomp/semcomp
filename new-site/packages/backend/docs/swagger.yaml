basePath: /
definitions:
  auth.LoginUserRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  authBackoffice.LoginUserBackofficeRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  event.CreateEventRequest:
    properties:
      description:
        type: string
      end_date:
        type: string
      has_attendance:
        type: boolean
      init_date:
        type: string
      location:
        type: string
      name:
        maxLength: 200
        type: string
      type:
        maxLength: 50
        type: string
    required:
    - end_date
    - init_date
    - name
    type: object
  event.Event:
    properties:
      description:
        type: string
      end_date:
        type: string
      has_attendance:
        type: boolean
      init_date:
        type: string
      location:
        type: string
      name:
        type: string
      type:
        type: string
    type: object
  event.UpdateEventRequest:
    properties:
      description:
        type: string
      end_date:
        type: string
      has_attendance:
        type: boolean
      init_date:
        type: string
      location:
        type: string
      name:
        maxLength: 200
        type: string
      type:
        maxLength: 50
        type: string
    required:
    - end_date
    - init_date
    - name
    type: object
  permission.Permission:
    properties:
      permission_type:
        description: nil = sem acesso, "R" ou "RW"
        type: string
      section_name:
        type: string
      user:
        $ref: '#/definitions/userBackoffice.UserBackoffice'
      user_email:
        type: string
    type: object
  permission.PermissionRequest:
    properties:
      permission_type:
        maxLength: 2
        type: string
      section_name:
        maxLength: 200
        type: string
      user_email:
        maxLength: 150
        type: string
    required:
    - section_name
    - user_email
    type: object
  presence.CreatePresenceRequest:
    properties:
      email_admin:
        maxLength: 255
        type: string
      event_init_date:
        type: string
      event_name:
        maxLength: 200
        type: string
      user_number:
        type: integer
    required:
    - email_admin
    - event_init_date
    - event_name
    - user_number
    type: object
  presence.Presence:
    properties:
      email_admin:
        type: string
      event_init_date:
        type: string
      event_name:
        type: string
      user_number:
        type: integer
    type: object
  presence.UpdatePresenceRequest:
    properties:
      email_admin:
        maxLength: 255
        type: string
      event_init_date:
        type: string
      event_name:
        maxLength: 200
        type: string
      user_number:
        type: integer
    required:
    - email_admin
    - event_init_date
    - event_name
    - user_number
    type: object
  presencesettings.CreatePresenceTypeWeightRequest:
    properties:
      type_name:
        maxLength: 50
        type: string
      weight:
        minimum: 0
        type: number
    required:
    - type_name
    type: object
  presencesettings.PresenceTypeWeight:
    properties:
      id:
        type: integer
      type_name:
        type: string
      updated_at:
        type: string
      weight:
        type: number
    type: object
  presencesettings.PresencesSettingsListResult:
    properties:
      weights:
        items:
          $ref: '#/definitions/presencesettings.PresenceTypeWeight'
        type: array
    type: object
  presencesettings.UpdatePresenceTypeWeightRequest:
    properties:
      type_name:
        maxLength: 50
        type: string
      weight:
        minimum: 0
        type: number
    required:
    - type_name
    type: object
  product.BulkCreateProductsRequest:
    properties:
      products:
        items:
          $ref: '#/definitions/product.CreateProductRequest'
        maxItems: 100
        minItems: 1
        type: array
    required:
    - products
    type: object
  product.Coffee:
    properties:
      date_time:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  product.ComboItem:
    properties:
      combo_id:
        type: integer
      item:
        allOf:
        - $ref: '#/definitions/product.Product'
        description: |-
          Produto completo do item (permite Preload("ComboItems.Item")).
          RESTRICT: não deixa apagar um produto que ainda está sendo usado dentro de um combo.
      item_id:
        type: integer
      quantity:
        type: integer
    type: object
  product.ComboItemRequest:
    properties:
      item_id:
        type: integer
      quantity:
        minimum: 1
        type: integer
    required:
    - item_id
    - quantity
    type: object
  product.CreateCoffeeRequest:
    properties:
      date_time:
        type: string
      name:
        maxLength: 200
        type: string
    required:
    - date_time
    - name
    type: object
  product.CreateKitRequest:
    properties:
      color:
        maxLength: 50
        type: string
      is_babylook:
        type: boolean
      name:
        maxLength: 200
        type: string
      size:
        maxLength: 50
        type: string
    required:
    - color
    - name
    - size
    type: object
  product.CreateProductRequest:
    properties:
      coffee:
        $ref: '#/definitions/product.CreateCoffeeRequest'
      description:
        type: string
      is_selling:
        type: boolean
      items:
        items:
          $ref: '#/definitions/product.ComboItemRequest'
        type: array
      kit:
        $ref: '#/definitions/product.CreateKitRequest'
      name:
        type: string
      picture_url:
        type: string
      price:
        type: number
      type:
        allOf:
        - $ref: '#/definitions/product.ProductType'
        enum:
        - KIT
        - COFFEE
        - COMBO
    required:
    - price
    - type
    type: object
  product.Kit:
    properties:
      color:
        type: string
      id:
        type: integer
      is_babylook:
        type: boolean
      name:
        type: string
      size:
        type: string
    type: object
  product.Product:
    properties:
      coffee:
        $ref: '#/definitions/product.Coffee'
      combo_items:
        items:
          $ref: '#/definitions/product.ComboItem'
        type: array
      description:
        type: string
      discounted_price:
        description: Preço com desconto PAPFE (50%); calculado em memória, não persistido.
        type: number
      id:
        type: integer
      is_selling:
        type: boolean
      kit:
        allOf:
        - $ref: '#/definitions/product.Kit'
        description: |-
          Relacionamentos (preload)
          li que é uma boa prática usar isso aqui
      name:
        type: string
      picture_url:
        type: string
      price:
        type: number
      type:
        $ref: '#/definitions/product.ProductType'
    type: object
  product.ProductType:
    enum:
    - KIT
    - COFFEE
    - COMBO
    type: string
    x-enum-varnames:
    - ProductTypeKit
    - ProductTypeCoffee
    - ProductTypeCombo
  product.UpdateCoffeeRequest:
    properties:
      date_time:
        type: string
      name:
        maxLength: 200
        type: string
    required:
    - date_time
    - name
    type: object
  product.UpdateKitRequest:
    properties:
      color:
        maxLength: 50
        type: string
      is_babylook:
        type: boolean
      name:
        maxLength: 200
        type: string
      size:
        maxLength: 50
        type: string
    required:
    - color
    - name
    - size
    type: object
  product.UpdateProductRequest:
    properties:
      coffee:
        $ref: '#/definitions/product.UpdateCoffeeRequest'
      description:
        type: string
      is_selling:
        type: boolean
      items:
        items:
          $ref: '#/definitions/product.ComboItemRequest'
        type: array
      kit:
        $ref: '#/definitions/product.UpdateKitRequest'
      name:
        type: string
      picture_url:
        type: string
      price:
        type: number
      type:
        allOf:
        - $ref: '#/definitions/product.ProductType'
        enum:
        - KIT
        - COFFEE
        - COMBO
    required:
    - price
    - type
    type: object
  sales.CreateSaleItemRequest:
    properties:
      kit_product_id:
        description: |-
          KitProductID é obrigatório quando ProductID refere um COMBO: indica qual
          variante de KIT (tamanho/cor/corte) o usuário selecionou dentro do combo.
        type: integer
      product_id:
        type: integer
      quantity:
        minimum: 1
        type: integer
    required:
    - product_id
    - quantity
    type: object
  sales.CreateSaleRequest:
    properties:
      description:
        description: Description é opcional e usada apenas na descrição da cobrança
          PIX no Mercado Pago.
        maxLength: 255
        type: string
      dietary_restrictions:
        maxLength: 1000
        type: string
      items:
        items:
          $ref: '#/definitions/sales.CreateSaleItemRequest'
        minItems: 1
        type: array
      payment_method:
        maxLength: 50
        type: string
      status:
        allOf:
        - $ref: '#/definitions/sales.SaleStatus'
        enum:
        - PENDENTE
        - PAGO
        - REJEITADO
        - CANCELADO
        - REEMBOLSADO
    required:
    - items
    - payment_method
    type: object
  sales.Sale:
    properties:
      created_at:
        type: string
      dietary_restrictions:
        description: |-
          DietaryRestrictions só faz sentido para vendas com produtos do tipo
          COFFEE (direto ou via COMBO).
        type: string
      has_coffee_items:
        type: boolean
      has_kit_items:
        description: |-
          Campos calculados (não persistidos): indicam se a venda envolve produtos
          do tipo KIT e/ou COFFEE, considerando também itens dentro de um COMBO.
          Preenchidos por ComputeItemFlags() após o carregamento de Items/Product.
        type: boolean
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/sales.SaleItem'
        type: array
      mercadopago_id:
        description: |-
          MercadoPagoID substitui a antiga tabela `payments`: só é preenchido
          quando PaymentMethod == "pix" (ou outro método processado via MP).
        type: string
      payment_method:
        type: string
      pix_expiration:
        description: |-
          PixExpiration é transitório (não persistido): o front calcula a expiração
          pela janela padrão de 30min a partir de CreatedAt quando o campo vem vazio.
        type: string
      qr_code:
        description: |-
          QRCode (copia-e-cola) e QRCodeBase64 são persistidos na venda para permitir
          reabrir pagamentos PIX pendentes (ex: tela "Ver pagamentos pendentes").
        type: string
      qr_code_base64:
        type: string
      status:
        $ref: '#/definitions/sales.SaleStatus'
      total_amount:
        type: number
      updated_at:
        type: string
      user:
        $ref: '#/definitions/user.User'
      user_number:
        type: integer
    type: object
  sales.SaleItem:
    properties:
      id:
        type: integer
      is_picked_up:
        description: 'Indica se o item (ex: KIT / Camiseta) já foi retirado presencialmente.'
        type: boolean
      kit_product:
        $ref: '#/definitions/product.Product'
      kit_product_id:
        description: |-
          KitProductID registra qual variante de KIT (tamanho/cor) o usuário escolheu
          quando o ProductID é um COMBO. Nullable: nulo para KITs e COFFEEs avulsos.
        type: integer
      product:
        $ref: '#/definitions/product.Product'
      product_id:
        type: integer
      quantity:
        type: integer
      sale_id:
        type: integer
      unit_price:
        type: number
    type: object
  sales.SaleStatus:
    enum:
    - PENDENTE
    - PAGO
    - REJEITADO
    - CANCELADO
    - REEMBOLSADO
    - EXPIRADO
    type: string
    x-enum-varnames:
    - SaleStatusPending
    - SaleStatusPaid
    - SaleStatusRejected
    - SaleStatusCanceled
    - SaleStatusRefunded
    - SaleStatusExpired
  sales.UpdateSaleItemPickupRequest:
    properties:
      is_picked_up:
        type: boolean
    type: object
  sales.UpdateSaleRequest:
    properties:
      dietary_restrictions:
        description: |-
          Ponteiro para distinguir "não enviado" (nil → não altera) de "enviado vazio"
          (ptr para "" → limpa o campo no banco).
        maxLength: 1000
        type: string
      payment_method:
        maxLength: 50
        type: string
      status:
        allOf:
        - $ref: '#/definitions/sales.SaleStatus'
        enum:
        - PENDENTE
        - PAGO
        - REJEITADO
        - CANCELADO
        - REEMBOLSADO
    type: object
  sponsor.PublicSponsor:
    properties:
      cnpj:
        type: string
      logo:
        type: string
      name:
        type: string
      website:
        type: string
    type: object
  sponsor.Sponsor:
    properties:
      clicks:
        type: integer
      cnpj:
        type: string
      logo:
        type: string
      name:
        type: string
      packages:
        items:
          $ref: '#/definitions/sponsor.SponsorPackage'
        type: array
      website:
        type: string
    type: object
  sponsor.SponsorPackage:
    properties:
      package:
        type: string
      sponsor_cnpj:
        type: string
      year:
        type: integer
    type: object
  user.PapfeApprovalRequest:
    properties:
      approved:
        type: boolean
    required:
    - approved
    type: object
  user.ResendVerificationRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  user.SafeUser:
    properties:
      age:
        type: integer
      autoriza_compartilhamento:
        type: boolean
      city:
        type: string
      disabilities:
        type: string
      education:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      gender:
        type: string
      hasPapfe:
        type: boolean
      linkedin:
        type: string
      name:
        type: string
      presence_rate:
        type: number
      profession:
        type: string
      quer_cracha:
        type: boolean
      telegram:
        type: string
      user_number:
        type: string
    type: object
  user.UpdateProfileRequest:
    properties:
      city:
        type: string
      linkedin:
        type: string
      name:
        type: string
      profession:
        type: string
      telegram:
        type: string
    required:
    - city
    - name
    type: object
  user.UpdateUserRequest:
    properties:
      age:
        type: integer
      autoriza_compartilhamento:
        type: boolean
      city:
        type: string
      disabilities:
        type: string
      education:
        type: string
      email:
        type: string
      gender:
        type: string
      hasPapfe:
        type: boolean
      linkedin:
        type: string
      name:
        type: string
      profession:
        type: string
      quer_cracha:
        type: boolean
      telegram:
        type: string
    required:
    - age
    - city
    - disabilities
    - education
    - email
    - gender
    - name
    type: object
  user.User:
    properties:
      age:
        type: integer
      autoriza_compartilhamento:
        type: boolean
      city:
        type: string
      disabilities:
        type: string
      education:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      gender:
        type: string
      hasPapfe:
        type: boolean
      linkedin:
        type: string
      name:
        type: string
      passwordHash:
        type: string
      presence_rate:
        type: number
      profession:
        type: string
      quer_cracha:
        type: boolean
      telegram:
        type: string
      user_number:
        type: integer
      verificationSendCount:
        type: integer
      verificationSentAt:
        type: string
      verificationTokenExpiresAt:
        type: string
      verificationTokenHash:
        type: string
      verificationWindowStartAt:
        type: string
    type: object
  user.VerifyEmailRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  userBackoffice.CreateUserBackofficeRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  userBackoffice.SafeUserB:
    properties:
      email:
        type: string
    type: object
  userBackoffice.UpdateUserBackofficeRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  userBackoffice.UserBackoffice:
    properties:
      email:
        type: string
      passwordHash:
        type: string
    type: object
host: localhost:4000
info:
  contact: {}
  description: API do backend da Semcomp.
  title: Semcomp API
  version: "1.0"
paths:
  /admin/events:
    post:
      consumes:
      - application/json
      description: Cadastra um evento no sistema
      parameters:
      - description: Dados do evento
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/event.CreateEventRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Evento criado com sucesso!
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Dados inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Evento já existe
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cria um novo evento
      tags:
      - Event Backoffice
  /admin/events/{eventName}/{initDate}:
    delete:
      consumes:
      - application/json
      description: Remove um evento do sistema
      parameters:
      - description: Nome do evento
        in: path
        name: eventName
        required: true
        type: string
      - description: Data de início do evento (RFC3339)
        in: path
        name: initDate
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Evento removido com sucesso
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Data inválida
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Evento não encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Deleta evento
      tags:
      - Event Backoffice
    put:
      consumes:
      - application/json
      description: Altera os dados de um evento existente
      parameters:
      - description: Nome do evento
        in: path
        name: eventName
        required: true
        type: string
      - description: Data de início do evento (RFC3339)
        in: path
        name: initDate
        required: true
        type: string
      - description: Dados para atualização
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/event.UpdateEventRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Evento atualizado com sucesso
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Dados inválidos ou data inválida
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Evento não encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Atualiza evento
      tags:
      - Event Backoffice
  /admin/login:
    post:
      consumes:
      - application/json
      description: Autentica um usuário administrador e retorna o token JWT com permissões
      parameters:
      - description: Credenciais de login
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/authBackoffice.LoginUserBackofficeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login realizado
          schema:
            additionalProperties: true
            type: object
        "400":
          description: JSON ou requisição inválida
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Email e/ou senha inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login do backoffice
      tags:
      - Auth Backoffice
  /admin/papfe-documents:
    get:
      description: Retorna metadados de todos os comprovantes PAPFE cadastrados
      produces:
      - application/json
      responses:
        "200":
          description: Lista de comprovantes PAPFE
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lista comprovantes PAPFE
      tags:
      - Usuários (Participantes)
  /admin/permissions:
    get:
      consumes:
      - application/json
      description: Retorna uma lista paginada de permissões cadastradas
      parameters:
      - default: 1
        description: Página atual
        in: query
        name: page
        type: integer
      - default: 10
        description: Limite de itens por página
        in: query
        name: limit
        type: integer
      - default: user_email
        description: Campo de ordenação
        in: query
        name: sort_by
        type: string
      - default: asc
        description: Ordem (asc/desc)
        in: query
        name: sort_order
        type: string
      - description: Campo de busca
        in: query
        name: search_by
        type: string
      - description: Valor de busca
        in: query
        name: search_value
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Lista de permissões paginada
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Parâmetro inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lista permissões
      tags:
      - Permission Backoffice
    post:
      consumes:
      - application/json
      description: Vincula uma permissão (R ou RW) de um usuário do backoffice a uma
        seção
      parameters:
      - description: Dados da permissão
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/permission.PermissionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Permissão criada com sucesso!
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Dados inválidos, seção/usuário inexistente ou tipo inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno
          schema:
            additionalProperties:
              type: string
